name: Prueba ortografia actualidadnacional (no publica)

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml anthropic Pillow
      - name: Probar reescritura y ortografia (sin publicar)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACTUALIDAD_PANEL_USER: ${{ secrets.ACTUALIDAD_PANEL_USER }}
          ACTUALIDAD_PANEL_PASS: ${{ secrets.ACTUALIDAD_PANEL_PASS }}
        run: |
          python -m py_compile automatizador.py && echo "SINTAXIS OK"
          cat > /tmp/prueba.py <<'PY'
          import sys
          sys.path.insert(0, ".")
          import automatizador as a

          print("=== 1) Revision ortografica ===")
          t, b, x = a.revisar_ortografia(
              "El gobierno de Kicillof ratificó que si se sostienen las PASO",
              "La medida se mantendra hasta nuevo aviso segun fuentes oficiales.",
              "El ministro dijo que aun no hay definiciones. Mas tarde, el confirmo que la decision esta tomada.",
              63, 170)
          print("TITULO:", t)
          assert "sí se sostienen" in t, "NO corrigio el si/sí"

          print("=== 2) Reescritura de notas REALES (politica 63/170 y deportes 45/84) ===")
          # Antes se usaba una nota inventada y repetida: el verificador la descartaba (correcto) y la prueba fallaba.
          a.URLS_PUBLICADAS = list(a.URLS_PUBLICADAS)
          def probar(nota, mt, mb, etiqueta):
              if not nota or not nota.get("titulo_original"):
                  return False
              try:
                  r = a.reescribir_con_ia(nota, max_titulo=mt, max_bajada=mb)
              except Exception as e:
                  print(f"  ({etiqueta} descartada por el control de calidad: {e})")
                  return False
              print(f"[{etiqueta}] TITULO ({len(r['titulo'])}/{mt}):", r["titulo"])
              print(f"[{etiqueta}] BAJADA ({len(r['bajada'])}/{mb}):", r["bajada"])
              print(f"[{etiqueta}] TEXTO: {len(r['texto'].split())} palabras")
              assert r["titulo"] and len(r["titulo"]) <= mt
              assert r["bajada"] and len(r["bajada"]) <= mb
              assert len(r["texto"].split()) >= 100
              return True
          ok_pol = False
          for url in a.obtener_noticias_infobae(6)[:3]:
              if probar(a.extraer_nota_infobae(url), 63, 170, "politica"):
                  ok_pol = True; break
          assert ok_pol, "Ninguna nota de politica paso la reescritura"

          print("=== 3) Deportes: 2 notas distintas por corrida ===")
          vistas = set(); ok_dep = 0
          for n in range(1, a.DEPORTES_POR_CORRIDA + 1):
              nd = a.obtener_nota_deportes_infobae(excluir=vistas)
              assert nd, f"No se encontro nota de deportes {n}"
              assert nd["url"] not in vistas, "Repitio la misma nota de deportes"
              vistas.add(nd["url"])
              print(f"  deportes {n}: {nd['titulo_original'][:70]}")
              if probar(nd, 45, 84, f"deportes{n}"):
                  ok_dep += 1
          assert len(vistas) == a.DEPORTES_POR_CORRIDA
          assert ok_dep >= 1, "Ninguna nota de deportes paso la reescritura"
          print("PRUEBA OK")
          PY
          python /tmp/prueba.py
