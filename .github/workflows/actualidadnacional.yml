name: Automatizador ActualidadNacional

on:
  schedule:
    # Cada 3 horas: 3:17, 6:17, 9:17, 12:17, 15:17, 18:17, 21:17 y 0:17 hora argentina
    - cron: '17 */3 * * *'
  workflow_dispatch:

concurrency:
  group: actualidadnacional
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar automatizador
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACTUALIDAD_PANEL_USER: ${{ secrets.ACTUALIDAD_PANEL_USER }}
          ACTUALIDAD_PANEL_PASS: ${{ secrets.ACTUALIDAD_PANEL_PASS }}
        run: python automatizador.py

      - name: Guardar registro de notas publicadas (y mantener vivo el horario)
        if: always()
        run: |
          date -u +%Y-%m-%d > ultima_corrida.txt
          git config user.name "bot actualidad"
          git config user.email "bot@actualidadnacional.net"
          for i in 1 2 3; do
            git add publicadas.json ultima_corrida.txt
            git diff --staged --quiet && break
            git commit -m "chore: registro de notas publicadas [skip ci]"
            if git push; then break; fi
            git pull --rebase || true
            sleep 3
          done
