name: Automatizador ActualidadNacional

on:
  schedule:
    # Cada 6 horas: 21:17, 3:17, 9:17 y 15:17 hora argentina
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: actualidadnacional
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar automatizador
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACTUALIDAD_PANEL_USER: ${{ secrets.ACTUALIDAD_PANEL_USER }}
          ACTUALIDAD_PANEL_PASS: ${{ secrets.ACTUALIDAD_PANEL_PASS }}
        run: python automatizador.py

      - name: Mantener vivo el horario (GitHub apaga los horarios si el repo pasa 60 dias sin cambios)
        if: github.event_name == 'schedule'
        run: |
          date -u +%Y-%m-%d > ultima_corrida.txt
          git config user.name "bot actualidad"
          git config user.email "bot@actualidadnacional.net"
          git add ultima_corrida.txt
          git diff --staged --quiet || (git commit -m "chore: ultima corrida [skip ci]" && git push) || true
